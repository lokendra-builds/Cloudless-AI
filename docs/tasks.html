<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloudless-AI · Tasks</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <style>
    @font-face { font-family: "Source Serif 4"; font-weight: 200 900; src: url("../vendor/fonts/source-serif-4.woff2") format("woff2"); }
    @font-face { font-family: "Inter"; font-weight: 100 900; src: url("../vendor/fonts/inter.woff2") format("woff2"); }
    :root { --bg:#faf9f5; --card:#fff; --line:#e5e2d8; --text:#141413; --muted:#73726c; --accent:#c96442; --soft:#f4e3dc; --ok:#3c7d3e; --oksoft:#e3efe0; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --bg:#262624; --card:#30302e; --line:#3a3936; --text:#faf9f5; --muted:#a6a39a; --accent:#d97757; --soft:#3d2b24; --ok:#9ccf86; --oksoft:#26331f; color-scheme: dark; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 Inter, system-ui, sans-serif; }
    main { max-width: 820px; margin: 0 auto; padding: 40px 20px 60px; }
    header { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
    header img { width: 44px; height: 44px; border-radius: 11px; }
    h1 { font: 500 34px/1.1 "Source Serif 4", Georgia, serif; letter-spacing: -.02em; margin: 0; }
    .sub { color: var(--muted); margin: 0 0 22px; }
    .bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 18px 0 8px; }
    .bar i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
    .counts { display: flex; gap: 16px; font-size: 13px; color: var(--muted); margin-bottom: 22px; flex-wrap: wrap; }
    .counts b { color: var(--text); }
    ol { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
    li { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
    li.in-progress { border-color: var(--accent); box-shadow: 0 0 0 3px var(--soft); }
    .num { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; background: var(--line); color: var(--muted); }
    li.done .num { background: var(--oksoft); color: var(--ok); }
    li.in-progress .num { background: var(--accent); color: #fff; }
    .t { font-weight: 500; }
    li.done .t { color: var(--muted); }
    .note { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
    .choices { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; }
    .choice { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 96px; text-decoration: none; color: var(--muted); font-size: 12px; font-weight: 500; text-align: center; }
    .choice img { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; border: 1px solid var(--line); transition: transform .15s; }
    .choice:hover img { transform: scale(1.06); }
    .pill { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 99px; white-space: nowrap; }
    .pill.done { background: var(--oksoft); color: var(--ok); }
    .pill.in-progress { background: var(--soft); color: var(--accent); }
    .pill.todo { background: transparent; color: var(--muted); border: 1px solid var(--line); }
    .pulse { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 6px; animation: p 1.2s ease-in-out infinite; vertical-align: 1px; }
    @keyframes p { 50% { opacity: .3; } }
    footer { margin-top: 22px; font-size: 12px; color: var(--muted); }
    a { color: var(--accent); }
    .made-in { display: inline-flex; align-items: center; gap: 4px; }
    .heart { width: 12px; height: 12px; fill: #e0414f; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  </style>
</head>
<body>
  <main>
    <header><img src="../assets/logo.svg" alt=""><h1>Cloudless-AI tasks</h1></header>
    <p class="sub">Everything you asked for, in order. This page refreshes itself every 5 seconds.</p>
    <div class="bar"><i id="bar" style="width:0"></i></div>
    <div class="counts" id="counts"></div>
    <ol id="list"></ol>
    <footer>Source: <code>docs/tasks.json</code> · <a href="../index.html">Open the app</a> · Updated <span id="updated">…</span> · <span class="made-in">Made in India with <svg class="heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 2.9 4.5 6.6 4.5c2.1 0 3.6 1.1 4.4 2.6.8-1.5 2.3-2.6 4.4-2.6 3.7 0 5.7 3.8 4.2 7.2C19.5 16.4 12 21 12 21z"/></svg><span class="sr-only">love</span></span></footer>
  </main>
  <script>
    const LABEL = { done: 'Done', 'in-progress': 'In progress', todo: 'To do' };
    async function load() {
      try {
        const data = await (await fetch('tasks.json', { cache: 'no-store' })).json();
        const t = data.tasks;
        const n = (s) => t.filter((x) => x.status === s).length;
        document.getElementById('bar').style.width = `${Math.round((n('done') / t.length) * 100)}%`;
        document.getElementById('counts').innerHTML = `<span><b>${n('done')}</b> done</span><span><b>${n('in-progress')}</b> in progress</span><span><b>${n('todo')}</b> to do</span><span><b>${t.length}</b> total</span>`;
        const list = document.getElementById('list');
        list.textContent = '';
        for (const task of t) {
          const li = document.createElement('li');
          li.className = task.status;
          li.innerHTML = '<span class="num"></span><span class="t"></span><span class="pill"></span>';
          li.querySelector('.num').textContent = task.status === 'done' ? '✓' : task.id;
          li.querySelector('.t').textContent = `${task.id}. ${task.title}`;
          if (task.note) { const s = document.createElement('span'); s.className = 'note'; s.textContent = task.note; li.querySelector('.t').appendChild(s); }
          if (task.images) {
            const g = document.createElement('span'); g.className = 'choices';
            task.images.forEach((im) => {
              const f = document.createElement('a'); f.className = 'choice'; f.href = im.src; f.target = '_blank';
              const img = document.createElement('img'); img.src = im.src; img.alt = ''; img.loading = 'lazy';
              const c = document.createElement('span'); c.textContent = im.label;
              f.append(img, c); g.appendChild(f);
            });
            li.querySelector('.t').appendChild(g);
          }
          const pill = li.querySelector('.pill');
          pill.className = `pill ${task.status}`;
          pill.innerHTML = task.status === 'in-progress' ? '<span class="pulse"></span>' : '';
          pill.append(LABEL[task.status] || task.status);
          list.appendChild(li);
        }
        document.getElementById('updated').textContent = new Date().toLocaleTimeString();
      } catch (e) { document.getElementById('updated').textContent = `could not load tasks.json (${e.message})`; }
    }
    load();
    setInterval(load, 5000);
  </script>
</body>
</html>
