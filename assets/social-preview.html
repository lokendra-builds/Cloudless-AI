<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Cloudless-AI social preview (1280x640)</title>
<style>
@font-face { font-family: "Source Serif 4"; font-weight: 200 900; src: url("../vendor/fonts/source-serif-4.woff2") format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 100 900; src: url("../vendor/fonts/inter.woff2") format("woff2"); }
* { box-sizing: border-box; }
body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: #faf9f5; font-family: Inter, sans-serif; color: #141413; position: relative; }
.glow { position: absolute; width: 760px; height: 760px; right: -180px; top: -220px; border-radius: 50%; background: radial-gradient(circle, rgba(217,119,87,.28), rgba(217,119,87,0) 65%); }
.left { position: absolute; left: 80px; top: 70px; width: 580px; }
.brand { display: flex; align-items: center; gap: 16px; font: 600 30px/1 "Source Serif 4", serif; }
.brand img { width: 64px; height: 64px; border-radius: 16px; }
h1 { font: 400 54px/1.08 "Source Serif 4", serif; letter-spacing: -.025em; margin: 34px 0 18px; }
h1 em { font-style: normal; color: #c96442; }
p { font-size: 21px; line-height: 1.45; color: #3d3d3a; margin: 0 0 24px; }
.pills { display: flex; gap: 8px; }
.pill { border: 1.5px solid #e5e2d8; background: #fff; border-radius: 999px; padding: 8px 14px; font-size: 15.5px; white-space: nowrap; font-weight: 500; color: #3d3d3a; }
.shot { position: absolute; right: -70px; top: 92px; width: 640px; border-radius: 18px; border: 1px solid #e5e2d8; box-shadow: 0 30px 80px rgba(20,20,19,.18); overflow: hidden; }
.shot img { display: block; width: 100%; }
.foot { position: absolute; left: 80px; bottom: 40px; font-size: 16px; color: #73726c; }
</style></head>
<body>
  <div class="glow"></div>
  <div class="left">
    <div class="brand"><img src="logo.svg" alt="">Cloudless-AI</div>
    <h1>Private AI chat that runs <em>in your browser</em></h1>
    <p>Local LLMs on your CPU or GPU. No server, no account, no API key. Your chats never leave your device.</p>
    <div class="pills"><span class="pill">WebGPU + WebAssembly</span><span class="pill">Projects &amp; Notes</span><span class="pill">Works offline</span></div>
  </div>
  <div class="shot"><img src="../screenshots/02-chat-code.png" alt=""></div>
  <div class="foot">github.com/lokendra-builds/Cloudless-AI · MIT · Made in India</div>
</body></html>
